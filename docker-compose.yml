services:
  postgres:
    image: postgres:16
    container_name: payment-reconciliation-db
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: payment-reconciliation-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres